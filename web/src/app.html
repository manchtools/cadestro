<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Cadestro — Linux fleet management web UI" />

		<meta name="cadestro-control-url" content="%cadestro.controlUrl%" />

		<link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon-light.ico" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-light-32x32.png" />

		<link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon-light.ico" media="(prefers-color-scheme: light)" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-light-16x16.png" media="(prefers-color-scheme: light)" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-light-32x32.png" media="(prefers-color-scheme: light)" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon-light.png" media="(prefers-color-scheme: light)" />

		<link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon-dark.ico" media="(prefers-color-scheme: dark)" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-dark-16x16.png" media="(prefers-color-scheme: dark)" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-dark-32x32.png" media="(prefers-color-scheme: dark)" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)" />

		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon-adaptive.svg" />

		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

		<meta property="og:title" content="Cadestro" />
		<meta property="og:description" content="Linux fleet management — declarative, audit-first, open source." />
		<meta property="og:image" content="%sveltekit.assets%/icon-512.png" />
		<meta property="og:type" content="website" />
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:image" content="%sveltekit.assets%/icon-512.png" />

		<meta name="theme-color" content="#6366F1" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#818CF8" media="(prefers-color-scheme: dark)" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
