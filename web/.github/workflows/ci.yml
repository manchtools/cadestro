name: CI

# Tag-only triggering meant direct-to-main pushes had zero CI gating
# (audit "Web CI runs only on tags" — fixed here). Now runs on every
# PR, every main push, and every release tag.
on:
  # Paths are repository-relative: this module is web/ inside the monorepo, and
  # it is also rebuilt when the contract it compiles against moves.
  pull_request:
    paths:
      - 'web/**'
      - 'contract/gen/ts/**'
      - 'contract/ts/**'
  push:
    branches:
      - main
    tags:
      - 'v*'

# Cancel in-progress runs for the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # One checkout: the contract's generated types (contract/gen/ts) and its
      # hand-written client (contract/ts) are in this repository, reached
      # through the $contract and $contractClient aliases.
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install
      # Symlink web's node_modules into the contract so svelte-check can
      # resolve @bufbuild/protobuf from files outside the web directory.
      - run: ln -s $(pwd)/node_modules ../contract/node_modules
      - run: bun run check
      - run: bunx playwright install --with-deps chromium
      - run: bun run test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 30

  build:
    # Image-push job only runs on tag pushes (release). On PRs and
    # main pushes we ONLY want the test job — `build` pushes to GHCR
    # with the ref name as the tag, which makes no sense for a PR
    # head and isn't a useful artifact for plain main pushes.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image tag contract, identical to the control image's because one
      # deployment resolves both from a single IMAGE_TAG:
      #   :<version>  -> the release tag without its leading v (what .env pins)
      #   :latest     -> the most recent stable release  (vYYYY.MM)
      #   :latest-rc  -> the most recent release candidate (vYYYY.MM-rcN)
      # A tag published with the leading v would be unreachable from a
      # deployment, because install.sh writes IMAGE_TAG=${RELEASE_TAG#v}.
      - name: Resolve tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" == *-rc* ]]; then
            echo "moving=latest-rc" >> "$GITHUB_OUTPUT"
          else
            echo "moving=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cadestro-web:${{ steps.tags.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/cadestro-web:${{ steps.tags.outputs.moving }}
          # The same string control stamps into its own binary
          # (-X main.version=${GITHUB_REF_NAME#v}). The UI compares its build
          # version against the one control reports from /health and reloads
          # itself when they differ, so a leading v here would make every first
          # visit to a fresh deployment reload once for nothing.
          build-args: VERSION=${{ steps.tags.outputs.version }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
