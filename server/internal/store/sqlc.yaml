version: "2"
sql:
  - engine: "sqlite"
    queries: "queries"
    schema: "migrations"
    gen:
      go:
        package: "generated"
        out: "generated"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_result_struct_pointers: true
        overrides:
          - db_type: "boolean"
            go_type: "bool"
          - db_type: "datetime"
            go_type: "time.Time"
          - column: "users.session_version"
            go_type: "int32"
          - column: "role_permissions.permission"
            go_type:
              import: "github.com/manchtools/cadestro/contract/gen/go/cadestro/v1"
              package: "cadestrov1"
              type: "Permission"
          - column: "actions.type"
            go_type:
              import: "github.com/manchtools/cadestro/contract/gen/go/cadestro/v1"
              package: "cadestrov1"
              type: "ActionType"
