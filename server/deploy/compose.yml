services:
  traefik:
    image: docker.io/traefik:v3.7.1
    restart: unless-stopped
    env_file:
      - ./config/traefik.env
    environment:
      CONTROL_DOMAIN: ${CONTROL_DOMAIN:?CONTROL_DOMAIN is required}
      AGENT_DOMAIN: ${AGENT_DOMAIN:?AGENT_DOMAIN is required}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro,z
      - ./traefik/dynamic:/etc/traefik/dynamic:ro,z
      - ./certs/ca.crt:/run/certs/ca.crt:ro,z
      - ./data/traefik:/letsencrypt:z
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  control:
    image: ghcr.io/manchtools/cadestro:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./config/control.env
    volumes:
      - ./certs:/run/certs:ro,z
      - ./secrets:/run/secrets:ro,z
      - ./data/control:/var/lib/cadestro:z
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "--spider", "https://127.0.0.1:8081/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  web:
    image: ghcr.io/manchtools/cadestro-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./config/web.env
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

networks:
  internal:
    driver: bridge
