# docref: begin deployment-services
services:
  traefik:
    image: docker.io/traefik:v3.7.1
    container_name: cadestro-traefik
    restart: unless-stopped
    # traefik-acme.env carries the ACME challenge setup.sh rendered from
    # ACME_CHALLENGE; traefik-dns.env carries the DNS provider credentials the
    # operator wrote, and is empty for an http01 deployment.
    env_file:
      - ./config/traefik-acme.env
      - ./config/traefik-dns.env
    environment:
      CONTROL_DOMAIN: ${CONTROL_DOMAIN:?CONTROL_DOMAIN is required}
      AGENT_DOMAIN: ${AGENT_DOMAIN:?AGENT_DOMAIN is required}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro,z
      - ./traefik/dynamic:/etc/traefik/dynamic:ro,z
      - ./certs/ca-trust-bundle.crt:/run/certs/ca-trust-bundle.crt:ro,z
      - ./data/traefik:/letsencrypt:z
    # `docker compose up -d --wait` waits only on services that declare a
    # healthcheck. Traefik is the only way into the deployment, so without this
    # the wait returns while every request into it still fails. It asks the
    # ping endpoint traefik.yml enables, over the internal entrypoint nothing
    # publishes.
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      internal:
        ipv4_address: 172.29.0.2
      agent_proxy:
        ipv4_address: 172.30.0.2

  control:
    image: ghcr.io/manchtools/cadestro:${IMAGE_TAG:-latest}
    container_name: cadestro-control
    restart: unless-stopped
    env_file: ./config/control.env
    volumes:
      - ./certs/ca.crt:/run/certs/ca.crt:ro,z
      - ./certs/ca.key:/run/certs/ca.key:ro,z
      - ./certs/ca-trust-bundle.crt:/run/certs/ca-trust-bundle.crt:ro,z
      - ./certs/control.crt:/run/certs/control.crt:ro,z
      - ./certs/control.key:/run/certs/control.key:ro,z
      - ./secrets/encryption.key:/run/secrets/encryption.key:ro,z
      - ./secrets/session-signing.pem:/run/secrets/session-signing.pem:ro,z
      - ./secrets/sealing.key:/run/secrets/sealing.key:ro,z
      - ./data/control:/var/lib/cadestro/state:z
      - ./data/artifacts:/var/lib/cadestro/artifacts:z
      - ./data/backups:/var/lib/cadestro/backups:z
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "--spider", "https://127.0.0.1:8081/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      internal:
        ipv4_address: 172.29.0.3
      agent_proxy:
        ipv4_address: 172.30.0.3

  # The administration UI, served on the same public hostname as control:
  # traefik/dynamic/routes.yml keeps control's own paths for control and hands
  # everything else here, so the browser's API origin is the page's own origin
  # and a fresh install needs no client configuration. It is released from this
  # repository under the same tag as control, which is why it shares IMAGE_TAG.
  # It reaches nothing itself — no volume, no agent network, no secret — so the
  # only thing it is given is the origin its RPCs go to.
  web:
    image: ghcr.io/manchtools/cadestro-web:${IMAGE_TAG:-latest}
    container_name: cadestro-web
    restart: unless-stopped
    env_file: ./config/web.env
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      internal:
        ipv4_address: 172.29.0.4
# docref: end deployment-services

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
  agent_proxy:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
