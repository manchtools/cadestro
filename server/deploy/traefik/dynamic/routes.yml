http:
  serversTransports:
    control-tls:
      serverName: control
      rootCAs:
        - /run/certs/ca.crt
      minVersion: VersionTLS13
      maxVersion: VersionTLS13
  routers:
    control:
      rule: 'Host(`{{ env "CONTROL_DOMAIN" }}`) && (PathPrefix(`/cadestro.v1.ControlService`) || Path(`/health`) || Path(`/ready`))'
      priority: 100
      entryPoints: [websecure]
      middlewares: [security-headers]
      service: control
      tls:
        certResolver: letsencrypt
    web:
      rule: 'Host(`{{ env "CONTROL_DOMAIN" }}`)'
      priority: 10
      entryPoints: [websecure]
      middlewares: [security-headers]
      service: web
      tls:
        certResolver: letsencrypt
  middlewares:
    security-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: no-referrer
        stsSeconds: 31536000
        stsIncludeSubdomains: true
  services:
    control:
      loadBalancer:
        serversTransport: control-tls
        servers:
          - url: https://control:8081
    web:
      loadBalancer:
        servers:
          - url: http://web:3000

tcp:
  routers:
    agents:
      rule: 'HostSNI(`{{ env "AGENT_DOMAIN" }}`)'
      entryPoints: [websecure]
      service: agents
      tls:
        passthrough: true
  services:
    agents:
      loadBalancer:
        servers:
          - address: control:8082
