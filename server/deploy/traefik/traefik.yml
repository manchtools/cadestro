api:
  dashboard: false





ping: {}

log:
  level: INFO

# docref: begin safe-access-log
accessLog:
  format: json
  fields:
    names:



      RequestPath: drop
      RequestLine: drop
    headers:
      defaultMode: drop
# docref: end safe-access-log

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: false

certificatesResolvers:
  letsencrypt:
    acme:




      storage: /letsencrypt/acme.json
