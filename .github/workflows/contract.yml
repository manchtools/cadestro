name: Contract

on:
  push:
    branches: [main]
    paths:
      - 'contract/**'
      - '.github/go-tools.env'
      - '.github/workflows/contract.yml'
  pull_request:
    paths:
      - 'contract/**'
      - '.github/go-tools.env'
      - '.github/workflows/contract.yml'

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: contract

env:
  GOWORK: 'off'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: contract/go.mod

      - name: Load Go analysis tool versions
        run: cat ../.github/go-tools.env >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: contract/package-lock.json

      - name: Install npm deps
        run: npm ci

      - name: Install generation tools
        run: make install-tools

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}

      - name: Verify contract
        run: ./scripts/verify.sh

      - name: Race tests
        run: go test -race -count=1 -p 1 ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}

      - name: Vulnerability scan
        run: govulncheck ./...
