name: Contract

# The protobuf contract and the two client surfaces generated from it. These
# jobs came from the predecessor SDK repository's test workflow, where the
# protos still lived; the sources moved to contract/ in this repository, so the
# jobs moved with them rather than staying behind under the SDK's name.
#
# Path filter: only the contract's own tree. Every OTHER module's workflow also
# fires on contract/** because they all compile against it — the dependency
# runs downstream, not here.
on:
  push:
    branches: [main]
    paths:
      - 'contract/**'
      - '.github/workflows/contract.yml'
  pull_request:
    paths:
      - 'contract/**'
      - '.github/workflows/contract.yml'

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: contract

env:
  # The contract is a leaf module that anything speaking this protocol resolves
  # on its own, and that is how CI must build it. The repository root carries a
  # go.work covering all four Go modules; without this, every job here would
  # silently compile against the workspace instead of the module.
  GOWORK: 'off'

jobs:
  static-checks:
    name: Static Checks (gofmt, vet, staticcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: contract/go.mod

      - name: gofmt
        run: |
          dirty=$(gofmt -l .)
          if [ -n "$dirty" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$dirty"
            echo "---- diff ----"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

  test-go:
    name: Go tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: contract/go.mod

      - run: go test -race -count=1 ./...

  proto-lint:
    name: Proto lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: contract/package-lock.json

      # `npm ci` only — no `|| npm install` fallback. The point of these steps
      # is that buf comes from package-lock.json; falling back to `npm install`
      # on a lock mismatch resolves whatever the ranges allow and defeats it.
      - name: Install npm deps
        run: npm ci

      # Same resolution the local gate and `make generate` use
      # (scripts/buf.sh: fail-closed to the lock-installed binary). A bare
      # `npx buf` DOWNLOADS registry-latest when the package is absent instead
      # of failing.
      - name: buf lint
        working-directory: contract/proto
        run: ../scripts/buf.sh lint

      - name: buf format (drift)
        working-directory: contract/proto
        run: ../scripts/buf.sh format --diff --exit-code

  # Run `make generate` and assert nothing changed. Catches the "edited a
  # .proto but forgot to regenerate" footgun before it lands in main.
  proto-gen-drift:
    name: Generated-code drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: contract/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: contract/package-lock.json

      - name: Install npm deps
        run: npm ci

      # Pin protoc — the generated `.pb.go` files carry a `// protoc vX.Y.Z`
      # comment that flips every protoc release, so an unpinned apt-get install
      # would surface false-positive drift against whatever version the
      # contributor ran locally.
      - name: Install protoc (pinned)
        env:
          PROTOC_VERSION: 30.2
        run: |
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: Install protoc plugins
        run: make install-tools

      - name: make generate
        run: make generate

      - name: Verify no drift
        run: |
          # Ignore the auto-generated `// protoc vX.Y.Z` comment in `.pb.go`
          # files — the line flips with every protoc release and isn't
          # semantic. The pinned protoc above keeps this filter conservative.
          if ! git diff --exit-code \
               -I '^//\s*protoc\s+v[0-9]+\.[0-9]+\(\.[0-9]+\)\?' \
               -- gen/; then
            echo ""
            echo "::error::generated code in contract/gen/ drifted from proto sources."
            echo "Run 'make generate' in contract/ and commit the result."
            exit 1
          fi

  ts-typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: contract/package-lock.json

      - name: Install npm deps
        run: npm ci

      - name: tsc --noEmit
        run: npm run typecheck

  ts-test:
    name: TypeScript unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: contract/package-lock.json

      - name: Install npm deps
        run: npm ci

      - name: Run tests
        run: npm test
