name: SDK

on:
  push:
    branches: [main]
    paths:
      - 'sdk/**'
      - 'contract/**'
      - '.github/go-tools.env'
      - '.github/workflows/sdk.yml'
  pull_request:
    paths:
      - 'sdk/**'
      - 'contract/**'
      - '.github/go-tools.env'
      - '.github/workflows/sdk.yml'

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    name: Static Checks (gofmt, vet, staticcheck, errcheck, govulncheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: sdk/go.mod

      - name: Load Go analysis tool versions
        run: cat ../.github/go-tools.env >> "$GITHUB_ENV"

      - name: gofmt
        run: |
          dirty=$(gofmt -l .)
          if [ -n "$dirty" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$dirty"
            echo "---- diff ----"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}
          staticcheck ./...

      - name: errcheck
        run: |
          go install github.com/kisielk/errcheck@${ERRCHECK_VERSION}
          errcheck -ignoretests ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          govulncheck ./...

  test-go-all:
    name: Go unit sweep (race, all SDK packages)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: sdk/go.mod

      - name: go test (excludes integration-tagged files)
        run: go test -p 1 -race -short ./...


  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: sdk/go.mod

      - name: Run pkg unit tests
        run: go test -p 1 -v -race -short ./...
        working-directory: sdk/pkg

      - name: Run sys unit tests
        run: go test -p 1 -v -race ./sys/user/ -run TestGeneratePassword
        working-directory: sdk

  test-sys:
    name: Integration Tests (sys/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build test image
        run: docker build -f sdk/test/Dockerfile.integration --target systemd -t cadestro-sdk-test .

      - name: Start systemd container
        run: docker run -d --privileged --memory=6g --cpus=4 --name cadestro-sdk-test cadestro-sdk-test

      - name: Wait for systemd
        run: |
          for i in $(seq 1 30); do
            if docker exec cadestro-sdk-test systemctl is-system-running --wait 2>/dev/null; then
              break
            fi
            sleep 0.5
          done

      - name: Run sys integration tests (ja_JP.UTF-8 locale)
        run: |
          docker exec -w /workspace cadestro-sdk-test \
            runuser -u cadestro -- env LANG=ja_JP.UTF-8 LC_ALL=ja_JP.UTF-8 \
              /usr/local/go/bin/go test -p 1 \
              -v -tags=integration -count=1 -timeout=10m \
              ./sdk/sys/exec/ ./sdk/sys/fs/ ./sdk/sys/user/ ./sdk/sys/service/ \
              ./sdk/sys/timesync/ ./sdk/sys/log/ ./sdk/sys/dns/ ./sdk/sys/desktop/

      - name: Cleanup
        if: always()
        run: docker rm -f cadestro-sdk-test 2>/dev/null || true

  test-network:
    name: Integration Tests (NetworkManager)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build systemd + NetworkManager image
        run: docker build -f sdk/test/Dockerfile.integration --target with-networkmanager -t cadestro-sdk-nm .

      - name: Start systemd + NM container
        run: docker run -d --privileged --memory=6g --cpus=4 --name cadestro-sdk-nm cadestro-sdk-nm

      - name: Wait for NetworkManager
        run: |
          for i in $(seq 1 60); do
            if docker exec cadestro-sdk-nm systemctl is-active NetworkManager >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          docker exec cadestro-sdk-nm systemctl is-active NetworkManager

      - name: Run network integration tests (root, real NetworkManager)
        run: |
          docker exec -w /workspace -e CADESTRO_NM_REQUIRED=1 cadestro-sdk-nm \
            /usr/local/go/bin/go test -p 1 -tags=integration -count=1 -v -timeout=5m \
              -run Integration ./sdk/sys/network/

      - name: Cleanup
        if: always()
        run: docker rm -f cadestro-sdk-nm 2>/dev/null || true

  container-tests:
    name: Container Tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pkg (debian/state-locked-apt)
            distro: debian
            state: state-locked-apt
            path: ./sdk/pkg/
            expect: apt-get fuser
          - label: sys/encryption (debian/base)
            distro: debian
            state: base
            path: ./sdk/sys/encryption/
            expect: cryptsetup
          - label: sys/firewall (debian/base)
            distro: debian
            state: base
            path: ./sdk/sys/firewall/
            expect: nft
          - label: sys/netconfig (debian/base)
            distro: debian
            state: base
            path: ./sdk/sys/netconfig/
            expect: ip
          - label: sys/inventory (debian/base)
            distro: debian
            state: base
            path: ./sdk/sys/inventory/
            expect: lsblk ip
          - label: sys/catrust (debian/base)
            distro: debian
            state: base
            path: ./sdk/sys/catrust/
            expect: update-ca-certificates openssl
          - label: sys/terminal (debian/base)
            distro: debian
            state: base
            path: ./sdk/sys/terminal/
            expect: useradd
          - label: sys/notify (debian/base)
            distro: debian
            state: base
            path: ./sdk/sys/notify/
            expect: wall
          - label: sys/osquery (debian/with-osquery)
            distro: debian
            state: with-osquery
            path: ./sdk/sys/osquery/
            expect: osqueryi
          - label: sys/antivirus (debian/with-clamav)
            distro: debian
            state: with-clamav
            path: ./sdk/sys/antivirus/
            expect: clamscan
          - label: sys/repo apt (debian/base)
            distro: debian
            state: base
            path: ./sdk/sys/repo/
            expect: apt-get gpg
          - label: sys/desktop (debian/base)
            distro: debian
            state: base
            path: ./sdk/sys/desktop/
            expect: useradd runuser env
          - label: sys/smart (debian/base)
            distro: debian
            state: base
            path: ./sdk/sys/smart/
            expect: smartctl
          - label: sys/reboot (debian/base)
            distro: debian
            state: base
            path: ./sdk/sys/reboot/
    steps:
      - uses: actions/checkout@v5

      - name: Build ${{ matrix.distro }}/${{ matrix.state }} image
        run: |
          docker build \
            -f sdk/test/Dockerfile.${{ matrix.distro }} \
            --target ${{ matrix.state }} \
            -t cadestro-sdk-container .

      - name: Assert expected tools present (no vacuous skip)
        if: matrix.expect != ''
        run: |
          for tool in ${{ matrix.expect }}; do
            if ! docker run --rm --memory=6g --cpus=4 cadestro-sdk-container sh -c "command -v $tool >/dev/null 2>&1"; then
              echo "::error::expected tool '$tool' absent from '${{ matrix.label }}' image — its container test would skip VACUOUSLY instead of running"
              exit 1
            fi
          done

      - name: Run container tests
        run: |
          docker run --rm --memory=6g --cpus=4 --shm-size=512m --cap-add NET_ADMIN cadestro-sdk-container \
            go test -p 1 -tags=container -count=1 -v ${{ matrix.path }} -run Container

  container-tests-distro:
    name: Container Tests (${{ matrix.label || matrix.distro }})
    runs-on: ubuntu-latest
    # docref: begin sdk-distro-matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: fedora,    notify: ./sdk/sys/notify/, walltool: wall }
          - { distro: almalinux, notify: ./sdk/sys/notify/, walltool: wall }
          - { distro: arch,      notify: ./sdk/sys/notify/, walltool: wall }
          - { distro: opensuse,  notify: '',                walltool: '' }
          - { distro: debian,   suite: trixie, notify: '',    walltool: '', label: debian/trixie }
    # docref: end sdk-distro-matrix
    steps:
      - uses: actions/checkout@v5

      - name: Build base image
        run: |
          build_args=()
          if [ -n "${{ matrix.suite }}" ]; then
            build_args+=(--build-arg "DEBIAN_SUITE=${{ matrix.suite }}")
          fi
          docker build "${build_args[@]}" -f sdk/test/Dockerfile.${{ matrix.distro }} --target base -t cadestro-base .

      - name: Assert base tool surface (no vacuous skip)
        run: |
          tools="cryptsetup nft ip lsblk useradd runuser env smartctl gpg flatpak fuser openssl update-ca-certificates ${{ matrix.walltool }}"
          if [ "${{ matrix.suite }}" = trixie ]; then
            tools="apt-get fuser cryptsetup nft ip lsblk useradd runuser env smartctl gpg openssl update-ca-certificates"
          fi
          for tool in $tools; do
            if ! docker run --rm --memory=6g --cpus=4 cadestro-base sh -c "command -v $tool >/dev/null 2>&1"; then
              echo "::error::tool '$tool' absent from the ${{ matrix.distro }} base image — its container test would skip VACUOUSLY"
              exit 1
            fi
          done
          docker run --rm --memory=6g --cpus=4 cadestro-base sh -c 'command -v update-ca-trust >/dev/null 2>&1 || command -v update-ca-certificates >/dev/null 2>&1' \
            || { echo "::error::no CA-trust refresh tool on ${{ matrix.distro }}"; exit 1; }

      - name: Run base-stage container tests
        run: |
          docker run --rm --memory=6g --cpus=4 --shm-size=512m --cap-add NET_ADMIN cadestro-base \
            go test -p 1 -tags=container -count=1 -v -run Container \
            ./sdk/sys/encryption/ ./sdk/sys/firewall/ ./sdk/sys/netconfig/ ./sdk/sys/inventory/ \
            ./sdk/sys/catrust/ ./sdk/sys/terminal/ ./sdk/sys/desktop/ ./sdk/sys/smart/ \
            ./sdk/sys/reboot/ ./sdk/sys/repo/ ./sdk/pkg/ ${{ matrix.notify }}

      - name: Run antivirus (with-clamav seed DB)
        run: |
          docker build -f sdk/test/Dockerfile.${{ matrix.distro }} --target with-clamav -t cadestro-clamav .
          docker run --rm --memory=6g --cpus=4 cadestro-clamav \
            go test -p 1 -tags=container -count=1 -v -run Container ./sdk/sys/antivirus/

  test-apt:
    name: Integration Tests (apt)
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: sdk/go.mod

      - name: Update apt cache
        run: sudo apt-get update

      - name: Run integration tests
        run: go test -p 1 -v -race ./...
        working-directory: sdk/pkg

      - name: Run tests with coverage
        run: go test -p 1 -coverprofile=coverage-apt.out ./...
        working-directory: sdk/pkg

      - name: Upload coverage
        uses: actions/upload-artifact@v5
        with:
          name: coverage-apt
          path: sdk/pkg/coverage-apt.out

  test-dnf:
    name: Integration Tests (dnf)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v5

      - name: Install Go
        run: dnf install -y golang

      - name: Update dnf cache
        run: dnf makecache

      - name: Run integration tests
        run: go test -p 1 -v ./...
        working-directory: sdk/pkg

      - name: Run tests with coverage
        run: go test -p 1 -coverprofile=coverage-dnf.out ./...
        working-directory: sdk/pkg

      - name: Upload coverage
        uses: actions/upload-artifact@v5
        with:
          name: coverage-dnf
          path: sdk/pkg/coverage-dnf.out

      - name: Run repo Manager container tests (real dnf)
        run: go test -p 1 -tags=container -count=1 -v -run Container ./sys/repo/
        working-directory: sdk

  test-pacman:
    name: Integration Tests (pacman)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v5

      - name: Install Go + sync pacman db
        run: pacman -Sy --noconfirm go git

      - name: Run integration tests
        run: go test -p 1 -v ./...
        working-directory: sdk/pkg

      - name: Run repo Manager container tests (real pacman)
        run: go test -p 1 -tags=container -count=1 -v -run Container ./sys/repo/
        working-directory: sdk

  test-zypper:
    name: Integration Tests (zypper)
    runs-on: ubuntu-latest
    container:
      image: opensuse/leap:latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v5

      - name: Install Go + refresh zypper
        run: |
          zypper --non-interactive --gpg-auto-import-keys refresh
          zypper --non-interactive install go git tar gzip

      - name: Run integration tests
        run: go test -p 1 -v ./...
        working-directory: sdk/pkg
        env:
          GOTOOLCHAIN: auto

      - name: Run repo Manager container tests (real zypper)
        run: go test -p 1 -tags=container -count=1 -v -run Container ./sys/repo/
        working-directory: sdk
        env:
          GOTOOLCHAIN: auto

  coverage-report:
    name: Coverage Report
    needs: [test-apt, test-dnf]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: sdk/go.mod

      - name: Download apt coverage
        uses: actions/download-artifact@v5
        with:
          name: coverage-apt
          path: coverage

      - name: Download dnf coverage
        uses: actions/download-artifact@v5
        with:
          name: coverage-dnf
          path: coverage

      - name: Display coverage
        run: |
          echo "=== APT Coverage ==="
          go tool cover -func=coverage/coverage-apt.out | tail -1
          echo ""
          echo "=== DNF Coverage ==="
          go tool cover -func=coverage/coverage-dnf.out | tail -1
