name: Deploy smoke test

# Brings up the published control image behind the reference deployment and
# verifies the running stack. On a pull request it fires only for deployment
# changes; the release workflow runs the same script against the image it just
# pushed.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Published control image tag to test
        default: latest-rc
  pull_request:
    paths:
      - 'server/deploy/**'
      - '.github/workflows/deploy-smoke.yml'

permissions:
  contents: read
  packages: read

defaults:
  run:
    working-directory: server

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
      - name: Show container tooling
        run: docker version && docker compose version
      - name: Run deployed-stack verification
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || '' }}
        run: bash deploy/smoke-test.sh
