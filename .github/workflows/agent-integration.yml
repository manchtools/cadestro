name: Agent Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'sdk/**'
      - 'contract/**'
      - '.github/workflows/agent-integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'agent/**'
      - 'sdk/**'
      - 'contract/**'
      - '.github/workflows/agent-integration.yml'
  workflow_call:

permissions:
  contents: read

jobs:
  integration:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    # docref: begin distro-matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian-12
            suite: bookworm
            dockerfile: agent/test/Dockerfile.integration
          - distro: debian-13
            suite: trixie
            dockerfile: agent/test/Dockerfile.integration
          - distro: fedora
            dockerfile: agent/test/Dockerfile.integration.fedora
          - distro: opensuse
            dockerfile: agent/test/Dockerfile.integration.opensuse
          - distro: archlinux
            dockerfile: agent/test/Dockerfile.integration.archlinux
    # docref: end distro-matrix
    steps:
      - uses: actions/checkout@v5

      - name: Build test image
        run: |
          build_args=()
          if [ -n "${{ matrix.suite }}" ]; then
            build_args+=(--build-arg "DEBIAN_SUITE=${{ matrix.suite }}")
          fi
          docker build \
            "${build_args[@]}" \
            -f ${{ matrix.dockerfile }} \
            -t cadestro-agent-test-${{ matrix.distro }} \
            .

      - name: Run integration tests
        run: |
          docker run --rm --memory=6g --cpus=4 cadestro-agent-test-${{ matrix.distro }} \
            go test -p 1 -tags=integration -count=1 -timeout=10m \
            ./agent/internal/executor/ -run Integration

  integration-edgecase:
    name: edge-cases (privileged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build test image
        run: |
          docker build \
            -f agent/test/Dockerfile.integration \
            -t cadestro-agent-test-debian \
            .

      - name: Run edge case tests
        run: |
          docker run --rm --privileged --memory=6g --cpus=4 cadestro-agent-test-debian \
            go test -p 1 -tags=integration -count=1 -timeout=10m \
            ./agent/internal/executor/ -run Integration -run EdgeCase
