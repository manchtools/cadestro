name: docref

on:
  push:
    branches: [main, 'v*']
  pull_request:

concurrency:
  group: docref-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docref-check:
    name: docref (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: agent prose (repository root)
            root: .
          - label: server
            root: server
          - label: sdk
            root: sdk
    steps:
      - uses: actions/checkout@v5

      - name: docref check (docs match the code they describe)
        run: |
          docker run --rm --memory=6g --cpus=4 \
            -v "${{ github.workspace }}/${{ matrix.root }}:/repo" \
            ghcr.io/manchtools/open-docref:v0.1.1 check
