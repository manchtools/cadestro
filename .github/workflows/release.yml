name: Release

# ONE release for the whole repository. The predecessor cut three independent
# releases from three repositories; here a single tag produces a single set of
# assets, a single checksum manifest, and a single signature over it:
#
#   cadestro-linux-{amd64,arm64}    the control binary
#   cadestrod-linux-{amd64,arm64}   the device agent
#   install.sh                      the agent installer, key- and version-stamped
#   *.spdx.json                     one SPDX SBOM per binary
#   SHA256SUMS                      covering every asset above
#   SHA256SUMS.sig                  Ed25519 over SHA256SUMS, made in `releases`
#
#   ghcr.io/manchtools/cadestro        control image (per-arch + manifest)
#   ghcr.io/manchtools/cadestro-web    administration UI image
#
# Build provenance is attested for every binary. The agent installer verifies
# the publisher signature over SHA256SUMS before it trusts a single hash, so
# the signing step is what makes the whole manifest — control binaries and
# SBOMs included — trustworthy.
#
# BYOK: the signing material is the fork's own. RELEASE_SIGNING_PUBLIC_KEY is a
# repository Actions variable; RELEASE_SIGNING_PRIVATE_KEY is a secret of the
# protected `releases` environment. Both are required and are checked against
# each other before anything is published.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  # The version, the prerelease decision, and the moving channel tag, resolved
  # once. Five jobs used to recompute `${GITHUB_REF_NAME#v}` and the -rc test
  # independently, which is five chances for them to disagree about what is
  # being released — and the control image and the UI image MUST agree, because
  # one deployment resolves both from a single IMAGE_TAG.
  #
  # Resolving the channel here rather than per job is also what keeps the
  # prerelease branch of the release body the only place in this file carrying
  # the literal `needs.version.outputs.is_prerelease` bash test. The agent's
  # installer-lint suite locates that branch by exactly that string; a second
  # copy elsewhere in the file silently shadowed it and the guard read the
  # wrong three lines.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
      channel: ${{ steps.resolve.outputs.channel }}
    steps:
      - name: Resolve
        id: resolve
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" == *-rc* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "channel=latest-rc" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  server-test:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
      - run: go test -count=1 -p 1 ./...
      - run: go vet ./...

  # The agent's release gate, unchanged in substance: no agent binary is
  # published without the per-distro integration matrix passing first.
  agent-integration:
    name: Agent integration tests
    uses: ./.github/workflows/agent-integration.yml

  server-build:
    name: Build cadestro (${{ matrix.arch }})
    needs: [version, server-test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
      - name: Build cadestro
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GOWORK: 'off'
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X main.version=${{ needs.version.outputs.version }}" \
            -o dist/cadestro-linux-${{ matrix.arch }} ./cmd/cadestro
      - uses: actions/upload-artifact@v5
        with:
          name: cadestro-${{ matrix.arch }}
          path: server/dist/cadestro-linux-${{ matrix.arch }}

  agent-build:
    name: Build cadestrod (${{ matrix.arch }})
    needs: [version, agent-integration]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod

      - name: Build cadestrod
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GOWORK: 'off'
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_PUBLIC_KEY" ]; then
            echo "RELEASE_SIGNING_PUBLIC_KEY repository variable is required" >&2
            exit 1
          fi
          mkdir -p dist
          go build -ldflags="-s -w -X main.version=${{ needs.version.outputs.version }} -X github.com/manchtools/cadestro/agent/internal/executor.releaseSigningPublicKey=${RELEASE_SIGNING_PUBLIC_KEY}" \
            -o dist/cadestrod-linux-${{ matrix.arch }} ./cmd/cadestrod

      - uses: actions/upload-artifact@v5
        with:
          name: cadestrod-${{ matrix.arch }}
          path: agent/dist/cadestrod-linux-${{ matrix.arch }}

  containers:
    name: Control image (${{ matrix.arch }})
    needs: [version, server-build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch != 'amd64'
        with:
          platforms: ${{ matrix.arch }}
      - uses: actions/download-artifact@v5
        with:
          name: cadestro-${{ matrix.arch }}
          path: server/dist
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push control image
        working-directory: server
        run: |
          chmod +x dist/cadestro-linux-${{ matrix.arch }}
          docker build --platform "linux/${{ matrix.arch }}" --provenance=false -f deploy/Containerfile.control \
            --build-arg BINARY=dist/cadestro-linux-${{ matrix.arch }} \
            -t ghcr.io/manchtools/cadestro:${{ needs.version.outputs.version }}-${{ matrix.arch }} .
          docker push ghcr.io/manchtools/cadestro:${{ needs.version.outputs.version }}-${{ matrix.arch }}

  smoke:
    name: Deployed-stack smoke test
    needs: [version, containers]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify deployed target
        env:
          IMAGE_TAG: ${{ needs.version.outputs.version }}-amd64
        run: bash deploy/smoke-test.sh

  manifests:
    name: Control image manifests
    needs: [version, containers, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version and channel manifests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          image=ghcr.io/manchtools/cadestro
          docker manifest create "$image:$VERSION" "$image:$VERSION-amd64" "$image:$VERSION-arm64"
          docker manifest push "$image:$VERSION"
          docker manifest create --amend "$image:$CHANNEL" "$image:$VERSION-amd64" "$image:$VERSION-arm64"
          docker manifest push "$image:$CHANNEL"

  web-image:
    name: Administration UI image
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image tag contract, identical to the control image's because one
      # deployment resolves both from a single IMAGE_TAG — which is why both
      # take their tags from the same `version` job rather than each deciding
      # for itself:
      #   :<version>  -> the release tag without its leading v (what .env pins)
      #   :latest     -> the most recent stable release  (vYYYY.MM)
      #   :latest-rc  -> the most recent release candidate (vYYYY.MM-rcN)
      # A tag published with the leading v would be unreachable from a
      # deployment, because install.sh writes IMAGE_TAG=${RELEASE_TAG#v}.
      #
      # Built from the repository root: the app compiles against the contract
      # in contract/ through the $contract and $contractClient aliases, and
      # those files are outside web/.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cadestro-web:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/cadestro-web:${{ needs.version.outputs.channel }}
          # The same string control stamps into its own binary
          # (-X main.version=...). The UI compares its build version against the
          # one control reports from /health and reloads itself when they
          # differ, so a leading v here would make every first visit to a fresh
          # deployment reload once for nothing.
          build-args: VERSION=${{ needs.version.outputs.version }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # docref: begin release-signing
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [version, server-build, agent-build, manifests, web-image]
    environment: releases
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts/

      - name: Prepare release assets
        env:
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_PUBLIC_KEY" ]; then
            echo "RELEASE_SIGNING_PUBLIC_KEY repository variable is required" >&2
            exit 1
          fi
          mkdir -p release
          cp artifacts/cadestro-amd64/* release/
          cp artifacts/cadestro-arm64/* release/
          cp artifacts/cadestrod-amd64/* release/
          cp artifacts/cadestrod-arm64/* release/
          cp agent/install.sh release/
          sed -i "s|__RELEASE_SIGNING_PUBLIC_KEY__|${RELEASE_SIGNING_PUBLIC_KEY}|g" release/install.sh
          if grep -q '__RELEASE_SIGNING_PUBLIC_KEY__' release/install.sh; then
            echo "release installer still contains the public-key placeholder" >&2
            exit 1
          fi
          # Stamp the installer's own release so running it without -v installs
          # THIS release: the GitHub "latest" alias resolves only
          # non-prereleases and hands a prerelease user mismatched assets.
          # The tag is validated against the release format first: git allows
          # sed-significant characters like & and | in refnames, and while the
          # placeholder grep below already fails closed on a corrupted
          # substitution, a malformed tag should fail by name, not by symptom.
          if ! printf '%s' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]{4}\.[0-9]{2}(\.[0-9]{2})?(-[A-Za-z0-9.]+)?$'; then
            echo "refusing to stamp non-release tag name: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          sed -i "s|__INSTALLER_RELEASE_VERSION__|${GITHUB_REF_NAME}|g" release/install.sh
          if grep -q '__INSTALLER_RELEASE_VERSION__' release/install.sh; then
            echo "release installer still contains the version placeholder" >&2
            exit 1
          fi

      - uses: anchore/sbom-action/download-syft@v0
        id: syft

      - name: SBOMs
        # One SPDX SBOM per shipped binary — control AND agent. The agent
        # binary had none before; a signed manifest that covers half the
        # artefacts documents half the supply chain.
        run: |
          shopt -s nullglob
          bins=()
          for bin in release/cadestro-linux-* release/cadestrod-linux-*; do
            [[ "$bin" == *.spdx.json ]] && continue
            bins+=("$bin")
          done
          [[ ${#bins[@]} -gt 0 ]] || { echo "no binaries to scan" >&2; exit 1; }
          for bin in "${bins[@]}"; do
            "${{ steps.syft.outputs.cmd }}" scan "file:$bin" -o "spdx-json=$bin.spdx.json"
          done

      - name: Checksums
        # Covers every asset in the directory, discovered rather than listed,
        # so a newly added artefact is signed for without editing this step.
        # SHA256SUMS itself is the only exclusion; its signature is produced
        # from this file in the next step.
        run: |
          cd release
          mapfile -t assets < <(find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%P\n' | sort)
          [[ ${#assets[@]} -gt 0 ]] || { echo "no release assets to checksum" >&2; exit 1; }
          sha256sum "${assets[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Sign release checksum manifest
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_PRIVATE_KEY" ] || [ -z "$RELEASE_SIGNING_PUBLIC_KEY" ]; then
            echo "protected release signing key and public key are required" >&2
            exit 1
          fi
          umask 077
          private_key="${RUNNER_TEMP}/release-signing-private.pem"
          cleanup_private_key() {
            rm -f "$private_key"
          }
          trap cleanup_private_key EXIT
          printf '%s' "$RELEASE_SIGNING_PRIVATE_KEY" > "$private_key"
          if ! openssl pkey -in "$private_key" -text -noout | grep -Fqx 'ED25519 Private-Key:'; then
            echo "RELEASE_SIGNING_PRIVATE_KEY must be an Ed25519 key" >&2
            exit 1
          fi
          derived_public=$(openssl pkey -in "$private_key" -pubout -outform DER | base64 -w0)
          if [ "$derived_public" != "$RELEASE_SIGNING_PUBLIC_KEY" ]; then
            echo "release signing private key does not match RELEASE_SIGNING_PUBLIC_KEY" >&2
            exit 1
          fi
          openssl pkeyutl -sign -rawin -inkey "$private_key" \
            -in release/SHA256SUMS -out release/SHA256SUMS.sig
      # docref: end release-signing

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/cadestro-linux-amd64
            release/cadestro-linux-arm64
            release/cadestrod-linux-amd64
            release/cadestrod-linux-arm64

      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          {
            echo "## What's Changed"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              for entry in "feat:Features" "fix:Bug Fixes" "perf:Performance" "refactor:Refactoring" "docs:Documentation" "test:Tests" "chore:Chores"; do
                prefix="${entry%%:*}"
                label="${entry#*:}"
                items=$(git log --pretty=format:"%s" "${PREV_TAG}..${GITHUB_REF_NAME}" | grep "^${prefix}[:(]" | sed "s/^${prefix}[^:]*: //" || true)
                if [ -n "$items" ]; then
                  echo "### ${label}"
                  echo "$items" | while IFS= read -r line; do echo "- ${line}"; done
                  echo ""
                fi
              done
              others=$(git log --pretty=format:"%s" "${PREV_TAG}..${GITHUB_REF_NAME}" | grep -v "^\(feat\|fix\|perf\|refactor\|docs\|test\|chore\)[:(]" || true)
              if [ -n "$others" ]; then
                echo "### Other Changes"
                echo "$others" | while IFS= read -r line; do echo "- ${line}"; done
                echo ""
              fi
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
            else
              echo "Initial release."
            fi
          } > changelog.md

      - name: Generate release body
        run: |
          TAG="${{ github.ref_name }}"
          cat changelog.md > body.md
          echo "" >> body.md
          if [[ "${{ needs.version.outputs.is_prerelease }}" == "true" ]]; then
            cat >> body.md <<EOF
          ## Installing the agent

          \`\`\`bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/${TAG}/install.sh | sudo bash -s -- -v ${TAG} -s https://your-server.example.com -t YOUR_TOKEN -p CA_SHA256
          \`\`\`

          ## Update

          To update an already registered agent to this prerelease:

          \`\`\`bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/${TAG}/install.sh | sudo bash -s -- -v ${TAG}
          \`\`\`

          The update stops the running service, downloads the new binary, updates the sudoers configuration, and restarts the service. Existing registration and credentials are preserved.
          EOF
          else
            cat >> body.md <<EOF
          ## Installing the agent

          \`\`\`bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sudo bash -s -- -s https://your-server.example.com -t YOUR_TOKEN -p CA_SHA256
          \`\`\`

          Or install a specific version:

          \`\`\`bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/${TAG}/install.sh | sudo bash -s -- -v ${TAG} -s https://your-server.example.com -t YOUR_TOKEN -p CA_SHA256
          \`\`\`

          ## Update

          To update an already registered agent to the latest version:

          \`\`\`bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sudo bash
          \`\`\`

          Or update to this specific version:

          \`\`\`bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/${TAG}/install.sh | sudo bash -s -- -v ${TAG}
          \`\`\`

          The update stops the running service, downloads the new binary, updates the sudoers configuration, and restarts the service. Existing registration and credentials are preserved.
          EOF
          fi
          # Quoted heredoc: GitHub substitutes every ${{ … }} into this `run`
          # string before bash sees it, so the expressions still resolve while
          # bash treats the rest — backticks included — as literal text.
          cat >> body.md <<'EOF'

          ## Container images

          | Image | Contents |
          |-------|----------|
          | `ghcr.io/${{ github.repository_owner }}/cadestro:${{ needs.version.outputs.version }}` | The control plane |
          | `ghcr.io/${{ github.repository_owner }}/cadestro-web:${{ needs.version.outputs.version }}` | The administration UI |

          ## Binaries

          | Binary | Platform |
          |--------|----------|
          | `cadestro-linux-amd64` | Control, Linux x86_64 |
          | `cadestro-linux-arm64` | Control, Linux ARM64 |
          | `cadestrod-linux-amd64` | Agent, Linux x86_64 |
          | `cadestrod-linux-arm64` | Agent, Linux ARM64 |

          Every binary ships an SPDX SBOM (`<binary>.spdx.json`) and a build-provenance
          attestation. `SHA256SUMS` covers every asset above and `SHA256SUMS.sig` is
          an Ed25519 signature over it, produced in the protected `releases`
          environment.
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ needs.version.outputs.is_prerelease == 'true' }}
          name: Cadestro ${{ needs.version.outputs.version }}
          files: release/*
          body_path: body.md
