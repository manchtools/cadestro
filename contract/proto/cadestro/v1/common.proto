syntax = "proto3";

package cadestro.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/manchtools/cadestro/contract/gen/go/cadestro/v1;cadestrov1";

message ActionId {
  string value = 1 [(buf.validate.field).string.ulid = true];
}

message DeviceId {
  string value = 1 [(buf.validate.field).string.ulid = true];
}

message RunId {
  string value = 1 [(buf.validate.field).string.ulid = true];
}

message OccurrenceId {
  string value = 1 [(buf.validate.field).string.ulid = true];
}

message ManifestId {
  string value = 1 [(buf.validate.field).string.ulid = true];
}

message MessageId {
  string value = 1 [(buf.validate.field).string.ulid = true];
}

message PolicyRevisionId {
  string value = 1 [(buf.validate.field).string.ulid = true];
}

message UserId {
  string value = 1 [(buf.validate.field).string.ulid = true];
}

message RegistrationTokenId {
  string value = 1 [(buf.validate.field).string.ulid = true];
}

message DeviceGroupId {
  string value = 1 [(buf.validate.field).string.ulid = true];
}

message AssignmentId {
  string value = 1 [(buf.validate.field).string.ulid = true];
}

message IdentityProviderId {
  string value = 1 [(buf.validate.field).string.ulid = true];
}

message OidcClientId {
  string value = 1 [(buf.validate.field).string.max_len = 255];
}

message AssignmentTargetId {
  string value = 1 [(buf.validate.field).string.ulid = true];
}

message AuditEventId {
  string value = 1 [(buf.validate.field).string.ulid = true];
}

message AuditStreamId {
  string value = 1 [(buf.validate.field).string.ulid = true];
}

message AuditActorId {
  string value = 1 [(buf.validate.field).string.ulid = true];
}

enum ExecutionStatus {
  EXECUTION_STATUS_UNSPECIFIED = 0;
  EXECUTION_STATUS_PENDING = 1;
  EXECUTION_STATUS_RUNNING = 2;
  EXECUTION_STATUS_SUCCESS = 3;
  EXECUTION_STATUS_FAILED = 4;
  EXECUTION_STATUS_SKIPPED = 5;
  EXECUTION_STATUS_TIMEOUT = 6;
  EXECUTION_STATUS_INDETERMINATE = 7;
}

enum DesiredState {
  DESIRED_STATE_UNSPECIFIED = 0;
  DESIRED_STATE_PRESENT = 1;
  DESIRED_STATE_ABSENT = 2;
}

enum DeviceStatus {
  DEVICE_STATUS_UNSPECIFIED = 0;
  DEVICE_STATUS_ONLINE = 1;
  DEVICE_STATUS_OFFLINE = 2;
}

enum ComplianceStatus {
  COMPLIANCE_STATUS_UNSPECIFIED = 0;
  COMPLIANCE_STATUS_COMPLIANT = 1;
  COMPLIANCE_STATUS_NON_COMPLIANT = 2;
}

enum AssignmentTargetType {
  ASSIGNMENT_TARGET_TYPE_UNSPECIFIED = 0;
  ASSIGNMENT_TARGET_TYPE_DEVICE = 1;
  ASSIGNMENT_TARGET_TYPE_DEVICE_GROUP = 2;
}

message CommandOutput {
  int32 exit_code = 1;
  string stdout = 2 [
    (buf.validate.field).string.max_len = 1048576,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  string stderr = 3 [
    (buf.validate.field).string.max_len = 1048576,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}
