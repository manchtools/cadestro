message ErrorDetail {
  ErrorCode code = 1 [(buf.validate.field).enum.defined_only = true];

  RequestId request_id = 2;
}

enum ComplianceStatus {
  COMPLIANCE_STATUS_UNKNOWN = 0;
  COMPLIANCE_STATUS_COMPLIANT = 1;
  COMPLIANCE_STATUS_NON_COMPLIANT = 2;
  COMPLIANCE_STATUS_IN_GRACE_PERIOD = 3;
}

message MaintenanceWindow {
  repeated MaintenanceWindowEntry schedule = 1;
}

message MaintenanceWindowEntry {
  repeated string days = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 7,
    (buf.validate.field).required = true,
    (buf.validate.field).repeated.items.string = {
      in: [
        "mon",
        "tue",
        "wed",
        "thu",
        "fri",
        "sat",
        "sun"
      ]
    }
  ];
  string allow = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.len = 11
  ];
}

message CommandOutput {
  int32 exit_code = 1;
  string stdout = 2 [
    (buf.validate.field).string.max_len = 1048576,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  string stderr = 3 [
    (buf.validate.field).string.max_len = 1048576,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}
