  DesiredState desired_state = 4;
  int32 timeout_seconds = 5 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 3600,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  ActionSchedule schedule = 6;

  oneof params {
    PackageParams package = 7;
    AppInstallParams app = 8;
    ShellParams shell = 9;
    ServiceParams service = 10;
    FileParams file = 11;
    UpdateParams update = 12;
    RepositoryParams repository = 13;
    FlatpakParams flatpak = 14;
    DirectoryParams directory = 15;
    UserParams user = 16;
    SshParams ssh = 17;
    SshdParams sshd = 18;
    AdminPolicyParams admin_policy = 19;
    LpsParams lps = 20;
    GroupParams group = 21;
    EncryptionAuthoringParams encryption = 22;
    WifiAuthoringParams wifi = 23;
    AgentUpdateParams agent_update = 24;
  }
}

