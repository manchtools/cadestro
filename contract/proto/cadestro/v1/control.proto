  rpc DeleteDevice(DeleteDeviceRequest) returns (DeleteDeviceResponse);
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse);
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);
  rpc RenameToken(RenameTokenRequest) returns (RenameTokenResponse);
  rpc DeleteToken(DeleteTokenRequest) returns (DeleteTokenResponse);
  rpc CreateAction(CreateActionRequest) returns (CreateActionResponse);
  rpc GetAction(GetActionRequest) returns (GetActionResponse);
  rpc ListActions(ListActionsRequest) returns (ListActionsResponse);
  rpc RenameAction(RenameActionRequest) returns (RenameActionResponse);
  rpc SetActionDescription(SetActionDescriptionRequest) returns (SetActionDescriptionResponse);
  rpc ConfigureAction(ConfigureActionRequest) returns (ConfigureActionResponse);
  rpc DeleteAction(DeleteActionRequest) returns (DeleteActionResponse);
