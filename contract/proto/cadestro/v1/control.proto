    PackageParams package = 11;
    AppInstallParams app = 12;
    ShellParams shell = 13;
    ServiceParams service = 14;
    FileParams file = 15;
    UpdateParams update = 16;
    RepositoryParams repository = 17;
    FlatpakParams flatpak = 18;
    DirectoryParams directory = 19;
    UserParams user = 20;
    SshParams ssh = 21;
    SshdParams sshd = 22;
    AdminPolicyParams admin_policy = 23;
    LpsParams lps = 24;
    GroupParams group = 25;
    ManagedEncryptionParams encryption = 26;
    ManagedWifiParams wifi = 27;
    AgentUpdateParams agent_update = 28;
  }
}

