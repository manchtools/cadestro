syntax = "proto3";

package cadestro.v1;

import "buf/validate/validate.proto";
import "cadestro/v1/actions.proto";
import "cadestro/v1/common.proto";
import "cadestro/v1/validate_ext.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/manchtools/cadestro/contract/gen/go/cadestro/v1;cadestrov1";

message RegisterRequest {
  string token = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 255
  ];
  string hostname = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 253
  ];
  string agent_version = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32
  ];
  bytes csr = 4 [(buf.validate.field).required = true];
}

message RegisterResponse {
  DeviceId device_id = 1 [(buf.validate.field).required = true];
  bytes ca_cert = 2 [(buf.validate.field).required = true];
  bytes certificate = 3 [(buf.validate.field).required = true];
  string control_url = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uri = true
  ];
}

message RenewCertificateRequest {
  bytes csr = 1 [(buf.validate.field).required = true];
}

message RenewCertificateResponse {
  bytes certificate = 1 [(buf.validate.field).required = true];
  google.protobuf.Timestamp not_after = 2 [(buf.validate.field).required = true];
}

message RefreshTokenRequest {
  string refresh_token = 1 [(buf.validate.field).required = true];
}

message RefreshTokenResponse {
  string access_token = 1 [(buf.validate.field).required = true];
  google.protobuf.Timestamp expires_at = 2 [(buf.validate.field).required = true];
  string refresh_token = 3 [(buf.validate.field).required = true];
}

message LogoutRequest {
  string refresh_token = 1 [(buf.validate.field).required = true];
}

message LogoutResponse {}

message User {
  UserId id = 1 [(buf.validate.field).required = true];
  string email = 2 [(buf.validate.field).string.email = true];
  string display_name = 3;
  string picture = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp last_login_at = 6;
}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  User user = 1 [(buf.validate.field).required = true];
}

message AuthMethodProvider {
  string slug = 1;
  string name = 2;
}

message ListAuthMethodsRequest {}

message ListAuthMethodsResponse {
  repeated AuthMethodProvider providers = 1;
}

message GetSSOLoginURLRequest {
  string slug = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  string redirect_url = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uri = true
  ];
}

message GetSSOLoginURLResponse {
  string login_url = 1 [(buf.validate.field).required = true];
}

message SSOCallbackRequest {
  string slug = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  string code = 2 [(buf.validate.field).required = true];
  string state = 3 [(buf.validate.field).required = true];
}

message SSOCallbackResponse {
  string access_token = 1 [(buf.validate.field).required = true];
  string refresh_token = 2 [(buf.validate.field).required = true];
  google.protobuf.Timestamp expires_at = 3 [(buf.validate.field).required = true];
  User user = 4 [(buf.validate.field).required = true];
}

message IdentityProvider {
  IdentityProviderId id = 1 [(buf.validate.field).required = true];
  string name = 2;
  string slug = 3;
  bool enabled = 4;
  OidcClientId client_id = 5;
  string issuer_url = 6;
  repeated string scopes = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CreateIdentityProviderRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  string slug = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.pattern = "^[a-zA-Z0-9]+$"
  ];
  OidcClientId client_id = 3 [(buf.validate.field).required = true];
  string client_secret = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 4096
  ];
  string issuer_url = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uri = true
  ];
  repeated string scopes = 6 [(buf.validate.field).repeated.items.string.max_len = 255];
}

message CreateIdentityProviderResponse {
  IdentityProvider provider = 1 [(buf.validate.field).required = true];
}

message GetIdentityProviderRequest {
  IdentityProviderId id = 1 [(buf.validate.field).required = true];
}

message GetIdentityProviderResponse {
  IdentityProvider provider = 1 [(buf.validate.field).required = true];
}

message ListIdentityProvidersRequest {}

message ListIdentityProvidersResponse {
  repeated IdentityProvider providers = 1;
}

message UpdateIdentityProviderRequest {
  IdentityProviderId id = 1 [(buf.validate.field).required = true];
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  bool enabled = 3;
  OidcClientId client_id = 4 [(buf.validate.field).required = true];
  string client_secret = 5 [
    (buf.validate.field).string.max_len = 4096,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  string issuer_url = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uri = true
  ];
  repeated string scopes = 7 [(buf.validate.field).repeated.items.string.max_len = 255];
}

message UpdateIdentityProviderResponse {
  IdentityProvider provider = 1 [(buf.validate.field).required = true];
}

message DeleteIdentityProviderRequest {
  IdentityProviderId id = 1 [(buf.validate.field).required = true];
}

message DeleteIdentityProviderResponse {}

message Device {
  DeviceId id = 1 [(buf.validate.field).required = true];
  string hostname = 2;
  string agent_version = 3;
  DeviceStatus status = 4;
  google.protobuf.Timestamp registered_at = 5;
  google.protobuf.Timestamp last_seen_at = 6;
  google.protobuf.Timestamp cert_expires_at = 7;
  ComplianceStatus compliance_status = 8;
  int32 compliance_total = 9;
  int32 compliance_passing = 10;
}

message ListDevicesRequest {
  int32 page_size = 1 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 100,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  string page_token = 2 [(buf.validate.field).string.(cadestro.v1.ulid_optional) = true];
}

message ListDevicesResponse {
  repeated Device devices = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetDeviceRequest {
  DeviceId id = 1 [(buf.validate.field).required = true];
}

message GetDeviceResponse {
  Device device = 1 [(buf.validate.field).required = true];
}

message DeleteDeviceRequest {
  DeviceId id = 1 [(buf.validate.field).required = true];
}

message DeleteDeviceResponse {}

message RegistrationToken {
  RegistrationTokenId id = 1 [(buf.validate.field).required = true];
  string value = 2;
  string name = 3;
  int32 max_uses = 4;
  int32 current_uses = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp created_at = 7;
  bool disabled = 8;
}

message CreateTokenRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  int32 max_uses = 2 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  google.protobuf.Timestamp expires_at = 3 [(buf.validate.field).required = true];
}

message CreateTokenResponse {
  RegistrationToken token = 1 [(buf.validate.field).required = true];
  string ca_fingerprint_pin = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.len = 64,
    (buf.validate.field).string.pattern = "^[0-9a-fA-F]+$"
  ];
}

message ListTokensRequest {
  int32 page_size = 1 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 100,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  string page_token = 2 [(buf.validate.field).string.(cadestro.v1.ulid_optional) = true];
  bool include_disabled = 3;
}

message ListTokensResponse {
  repeated RegistrationToken tokens = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message RenameTokenRequest {
  RegistrationTokenId id = 1 [(buf.validate.field).required = true];
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
}

message SetTokenDisabledRequest {
  RegistrationTokenId id = 1 [(buf.validate.field).required = true];
  bool disabled = 2;
}

message UpdateTokenResponse {
  RegistrationToken token = 1 [(buf.validate.field).required = true];
}

message DeleteTokenRequest {
  RegistrationTokenId id = 1 [(buf.validate.field).required = true];
}

message DeleteTokenResponse {}

message ManagedAction {
  ActionId id = 1 [(buf.validate.field).required = true];
  string name = 2;
  string description = 3;
  ActionType type = 4;
  DesiredState desired_state = 5;
  int32 timeout_seconds = 6;
  ActionSchedule schedule = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;

  oneof params {
    PackageParams package = 10;
    UpdateParams update = 11;
    ShellParams shell = 12;
  }
}

message CreateActionRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255
  ];
  string description = 2 [
    (buf.validate.field).string.max_len = 1024,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  ActionType type = 3 [(buf.validate.field).required = true];
  DesiredState desired_state = 4 [(buf.validate.field).required = true];
  int32 timeout_seconds = 5 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 3600,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  ActionSchedule schedule = 6;

  oneof params {
    PackageParams package = 7;
    UpdateParams update = 8;
    ShellParams shell = 9;
  }
}

message CreateActionResponse {
  ManagedAction action = 1 [(buf.validate.field).required = true];
}

message GetActionRequest {
  ActionId id = 1 [(buf.validate.field).required = true];
}

message GetActionResponse {
  ManagedAction action = 1 [(buf.validate.field).required = true];
}

message ListActionsRequest {
  int32 page_size = 1 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 100,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  string page_token = 2 [(buf.validate.field).string.(cadestro.v1.ulid_optional) = true];
  ActionType type_filter = 3 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

message ListActionsResponse {
  repeated ManagedAction actions = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message RenameActionRequest {
  ActionId id = 1 [(buf.validate.field).required = true];
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255
  ];
}

message UpdateActionDescriptionRequest {
  ActionId id = 1 [(buf.validate.field).required = true];
  string description = 2 [
    (buf.validate.field).string.max_len = 1024,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

message UpdateActionParamsRequest {
  ActionId id = 1 [(buf.validate.field).required = true];
  DesiredState desired_state = 2 [(buf.validate.field).required = true];
  int32 timeout_seconds = 3 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 3600,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  ActionSchedule schedule = 4;

  oneof params {
    PackageParams package = 5;
    UpdateParams update = 6;
    ShellParams shell = 7;
  }
}

message UpdateActionResponse {
  ManagedAction action = 1 [(buf.validate.field).required = true];
}

message DeleteActionRequest {
  ActionId id = 1 [(buf.validate.field).required = true];
}

message DeleteActionResponse {}

message DeviceGroup {
  DeviceGroupId id = 1 [(buf.validate.field).required = true];
  string name = 2;
  string description = 3;
  int32 member_count = 4;
  google.protobuf.Timestamp created_at = 5;
}

message DeviceGroupMember {
  DeviceId device_id = 1 [(buf.validate.field).required = true];
  string hostname = 2;
  string agent_version = 3;
  google.protobuf.Timestamp last_seen_at = 4;
}

message CreateDeviceGroupRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255
  ];
  string description = 2 [
    (buf.validate.field).string.max_len = 1024,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

message CreateDeviceGroupResponse {
  DeviceGroup group = 1 [(buf.validate.field).required = true];
}

message GetDeviceGroupRequest {
  DeviceGroupId id = 1 [(buf.validate.field).required = true];
}

message GetDeviceGroupResponse {
  DeviceGroup group = 1 [(buf.validate.field).required = true];
  repeated DeviceGroupMember devices = 2;
}

message ListDeviceGroupsRequest {
  int32 page_size = 1 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 100,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  string page_token = 2 [(buf.validate.field).string.(cadestro.v1.ulid_optional) = true];
}

message ListDeviceGroupsResponse {
  repeated DeviceGroup groups = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message ListDeviceGroupsForDeviceRequest {
  DeviceId device_id = 1 [(buf.validate.field).required = true];
}

message ListDeviceGroupsForDeviceResponse {
  repeated DeviceGroup groups = 1;
}

message RenameDeviceGroupRequest {
  DeviceGroupId id = 1 [(buf.validate.field).required = true];
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255
  ];
}

message UpdateDeviceGroupDescriptionRequest {
  DeviceGroupId id = 1 [(buf.validate.field).required = true];
  string description = 2 [
    (buf.validate.field).string.max_len = 1024,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

message UpdateDeviceGroupResponse {
  DeviceGroup group = 1 [(buf.validate.field).required = true];
}

message DeleteDeviceGroupRequest {
  DeviceGroupId id = 1 [(buf.validate.field).required = true];
}

message DeleteDeviceGroupResponse {}

message AddDeviceToGroupRequest {
  DeviceGroupId group_id = 1 [(buf.validate.field).required = true];
  DeviceId device_id = 2 [(buf.validate.field).required = true];
}

message AddDeviceToGroupResponse {
  DeviceGroup group = 1 [(buf.validate.field).required = true];
}

message RemoveDeviceFromGroupRequest {
  DeviceGroupId group_id = 1 [(buf.validate.field).required = true];
  DeviceId device_id = 2 [(buf.validate.field).required = true];
}

message RemoveDeviceFromGroupResponse {
  DeviceGroup group = 1 [(buf.validate.field).required = true];
}

message Assignment {
  AssignmentId id = 1 [(buf.validate.field).required = true];
  ActionId action_id = 2 [(buf.validate.field).required = true];
  string action_name = 3;
  AssignmentTargetType target_type = 4 [(buf.validate.field).required = true];
  AssignmentTargetId target_id = 5 [(buf.validate.field).required = true];
  string target_name = 6;
  google.protobuf.Timestamp created_at = 7;
}

message CreateAssignmentRequest {
  ActionId action_id = 1 [(buf.validate.field).required = true];
  AssignmentTargetType target_type = 2 [
    (buf.validate.field).enum = {
      in: [
        1,
        2
      ]
    },
    (buf.validate.field).required = true
  ];
  AssignmentTargetId target_id = 3 [(buf.validate.field).required = true];
}

message CreateAssignmentResponse {
  Assignment assignment = 1 [(buf.validate.field).required = true];
}

message DeleteAssignmentRequest {
  AssignmentId id = 1 [(buf.validate.field).required = true];
}

message DeleteAssignmentResponse {}

message ListAssignmentsRequest {
  ActionId action_id = 1;
  AssignmentTargetType target_type = 2 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  AssignmentTargetId target_id = 3;
}

message ListAssignmentsResponse {
  repeated Assignment assignments = 1;
}

message GetDeviceAssignmentsRequest {
  DeviceId device_id = 1 [(buf.validate.field).required = true];
}

message GetDeviceAssignmentsResponse {
  repeated ManagedAction actions = 1;
}

message ComplianceCheckResult {
  ActionId action_id = 1 [(buf.validate.field).required = true];
  string action_name = 2;
  bool compliant = 3;
  CommandOutput detection_output = 4;
  google.protobuf.Timestamp checked_at = 5;
}

message GetDeviceComplianceRequest {
  DeviceId device_id = 1 [(buf.validate.field).required = true];
}

message GetDeviceComplianceResponse {
  ComplianceStatus status = 1;
  repeated ComplianceCheckResult checks = 2;
}

message ExecutionResult {
  RunId run_id = 1 [(buf.validate.field).required = true];
  ActionId action_id = 2 [(buf.validate.field).required = true];
  string action_name = 3;
  ExecutionStatus status = 4;
  string error = 5;
  CommandOutput output = 6;
  google.protobuf.Timestamp completed_at = 7;
  bool compliant = 8;
  CommandOutput detection_output = 9;
}

message ListExecutionResultsRequest {
  DeviceId device_id = 1 [(buf.validate.field).required = true];
  int32 page_size = 2 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 100,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

message ListExecutionResultsResponse {
  repeated ExecutionResult results = 1;
}

message AuditEvent {
  AuditEventId id = 1 [(buf.validate.field).required = true];
  string event_type = 2;
  string stream_type = 3;
  AuditStreamId stream_id = 4;
  string actor_type = 5;
  AuditActorId actor_id = 6;
  google.protobuf.Timestamp occurred_at = 7;
}

message ListAuditEventsRequest {
  int32 page_size = 1 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 100,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  string page_token = 2 [
    (buf.validate.field).string.max_len = 32,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

message ListAuditEventsResponse {
  repeated AuditEvent events = 1;
  string next_page_token = 2;
}

service ControlService {
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
  rpc ListAuthMethods(ListAuthMethodsRequest) returns (ListAuthMethodsResponse);
  rpc GetSSOLoginURL(GetSSOLoginURLRequest) returns (GetSSOLoginURLResponse);
  rpc SSOCallback(SSOCallbackRequest) returns (SSOCallbackResponse);
  rpc CreateIdentityProvider(CreateIdentityProviderRequest) returns (CreateIdentityProviderResponse);
  rpc GetIdentityProvider(GetIdentityProviderRequest) returns (GetIdentityProviderResponse);
  rpc ListIdentityProviders(ListIdentityProvidersRequest) returns (ListIdentityProvidersResponse);
  rpc UpdateIdentityProvider(UpdateIdentityProviderRequest) returns (UpdateIdentityProviderResponse);
  rpc DeleteIdentityProvider(DeleteIdentityProviderRequest) returns (DeleteIdentityProviderResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc GetDevice(GetDeviceRequest) returns (GetDeviceResponse);
  rpc DeleteDevice(DeleteDeviceRequest) returns (DeleteDeviceResponse);
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse);
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);
  rpc RenameToken(RenameTokenRequest) returns (UpdateTokenResponse);
  rpc SetTokenDisabled(SetTokenDisabledRequest) returns (UpdateTokenResponse);
  rpc DeleteToken(DeleteTokenRequest) returns (DeleteTokenResponse);
  rpc CreateAction(CreateActionRequest) returns (CreateActionResponse);
  rpc GetAction(GetActionRequest) returns (GetActionResponse);
  rpc ListActions(ListActionsRequest) returns (ListActionsResponse);
  rpc RenameAction(RenameActionRequest) returns (UpdateActionResponse);
  rpc UpdateActionDescription(UpdateActionDescriptionRequest) returns (UpdateActionResponse);
  rpc UpdateActionParams(UpdateActionParamsRequest) returns (UpdateActionResponse);
  rpc DeleteAction(DeleteActionRequest) returns (DeleteActionResponse);
  rpc CreateDeviceGroup(CreateDeviceGroupRequest) returns (CreateDeviceGroupResponse);
  rpc GetDeviceGroup(GetDeviceGroupRequest) returns (GetDeviceGroupResponse);
  rpc ListDeviceGroups(ListDeviceGroupsRequest) returns (ListDeviceGroupsResponse);
  rpc ListDeviceGroupsForDevice(ListDeviceGroupsForDeviceRequest) returns (ListDeviceGroupsForDeviceResponse);
  rpc RenameDeviceGroup(RenameDeviceGroupRequest) returns (UpdateDeviceGroupResponse);
  rpc UpdateDeviceGroupDescription(UpdateDeviceGroupDescriptionRequest) returns (UpdateDeviceGroupResponse);
  rpc DeleteDeviceGroup(DeleteDeviceGroupRequest) returns (DeleteDeviceGroupResponse);
  rpc AddDeviceToGroup(AddDeviceToGroupRequest) returns (AddDeviceToGroupResponse);
  rpc RemoveDeviceFromGroup(RemoveDeviceFromGroupRequest) returns (RemoveDeviceFromGroupResponse);
  rpc CreateAssignment(CreateAssignmentRequest) returns (CreateAssignmentResponse);
  rpc DeleteAssignment(DeleteAssignmentRequest) returns (DeleteAssignmentResponse);
  rpc ListAssignments(ListAssignmentsRequest) returns (ListAssignmentsResponse);
  rpc GetDeviceAssignments(GetDeviceAssignmentsRequest) returns (GetDeviceAssignmentsResponse);
  rpc GetDeviceCompliance(GetDeviceComplianceRequest) returns (GetDeviceComplianceResponse);
  rpc ListExecutionResults(ListExecutionResultsRequest) returns (ListExecutionResultsResponse);
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
}
