}

// Update device sync interval
message SetDeviceSyncIntervalRequest {
  string id = 1 [(buf.validate.field).string.ulid = true];
  int32 sync_interval_minutes = 2 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 1440
