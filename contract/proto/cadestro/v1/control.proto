// Device assignment (admin-only)
// Assign a user or user group to a device. Exactly one of user_id or group_id must be set.
message AssignDeviceRequest {
  string device_id = 1 [(buf.validate.field).string.ulid = true];
  string user_id = 2 [(buf.validate.field).string.(cadestro.v1.ulid_optional) = true];
  string group_id = 3 [(buf.validate.field).string.(cadestro.v1.ulid_optional) = true];
  repeated string user_ids = 4 [
    (buf.validate.field).repeated.max_items = 256,
    (buf.validate.field).repeated.items.string.(cadestro.v1.ulid_optional) = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  repeated string group_ids = 5 [
    (buf.validate.field).repeated.max_items = 256,
    (buf.validate.field).repeated.items.string.(cadestro.v1.ulid_optional) = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

message AssignDeviceResponse {
  Device device = 1;
}

// Unassign a user or user group from a device. Exactly one of user_id or group_id must be set.
message UnassignDeviceRequest {
  string device_id = 1 [(buf.validate.field).string.ulid = true];
  string user_id = 2 [(buf.validate.field).string.(cadestro.v1.ulid_optional) = true];
  string group_id = 3 [(buf.validate.field).string.(cadestro.v1.ulid_optional) = true];
}

message UnassignDeviceResponse {
  Device device = 1;
}

message DeviceAssignee {
  string id = 1; // User or group ID
  // Subset of AssignmentTargetType: only USER and USER_GROUP are valid
  // values for a device assignee. DEVICE and DEVICE_GROUP are rejected
  // at write time.
  AssignmentTargetType type = 2;
  string name = 3; // User email or group name
}

