// ============================================================================
// Action Sets (Collection of Actions)
// ============================================================================

message ActionSet {
  string id = 1;
  string name = 2;
  string description = 3;
  int32 member_count = 4;
  google.protobuf.Timestamp created_at = 5;
  string created_by = 6;
  google.protobuf.Timestamp updated_at = 7;
  // Schedule that triggers every member action when fired. Required.
  // The set's schedule overrides each member action's own schedule —
  // member actions never fire on their own when assigned via this set.
  ActionSchedule schedule = 8 [(buf.validate.field).required = true];
  // Failure policy resolved onto every occurrence in the compiled manifest.
  // CONTINUE is the default; STOP must be selected explicitly.
  OnFailure on_failure = 9;
}

message ActionSetMember {
  string action_id = 1 [(buf.validate.field).string.ulid = true];
  // Position of this action within the set's execution order. When the
  // set's schedule fires, members are executed in ascending sort_order.
  // Stable tiebreak by action_id for ties.
  int32 sort_order = 2 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  string action_name = 3;
  ActionType action_type = 4;
}

message CreateActionSetRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255
  ];
  string description = 2 [
    (buf.validate.field).string.max_len = 1024,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Schedule that triggers every member action when fired. Required:
  // member actions never fire on their own when assigned via this set.
  ActionSchedule schedule = 3 [(buf.validate.field).required = true];
  // CONTINUE is the default; STOP must be selected explicitly.
  OnFailure on_failure = 4;
}

message CreateActionSetResponse {
  ActionSet set = 1;
}

message GetActionSetRequest {
  string id = 1 [(buf.validate.field).string.ulid = true];
}

message GetActionSetResponse {
  ActionSet set = 1;
  repeated ActionSetMember members = 2;
}

message ListActionSetsRequest {
  int32 page_size = 1 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 100,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
