// ============================================================================
// Devices
// ============================================================================

message Device {
  string id = 1;
  string hostname = 2;
  string agent_version = 3;
  // Online / offline, derived from last_seen_at on the server.
  DeviceStatus status = 4;
  google.protobuf.Timestamp registered_at = 5;
  google.protobuf.Timestamp last_seen_at = 6;
  google.protobuf.Timestamp cert_expires_at = 7;
  map<string, string> labels = 8;
  repeated string assigned_user_ids = 9; // Users assigned to this device
  repeated string assigned_group_ids = 10; // User groups assigned to this device
  // Stream synchronization interval in minutes (0 = use default of 30 minutes).
  int32 sync_interval_minutes = 11;
  // Compliance status based on detection scripts
  ComplianceStatus compliance_status = 12;
  google.protobuf.Timestamp compliance_checked_at = 13;
  int32 compliance_total = 14; // Total number of compliance checks
  int32 compliance_passing = 15; // Number of passing checks
  // Freshness of the server-scheduled inventory collection.
  // last_inventory_at is MAX(collected_at) across the device's inventory;
  // unset when no inventory has ever been collected.
  google.protobuf.Timestamp last_inventory_at = 16;
  // True when inventory age exceeds the resolved interval plus grace
  // (max(1h, 25% of interval)) — computed server-side from policy, so it
  // is valid even while the device is offline.
  bool inventory_overdue = 17;
  // Device-level inventory interval override in minutes. Resolution:
  // device override first, then group minimum, then the 1440-minute
  // server default; 0 means inherit.
  int32 inventory_interval_minutes = 18;
}

message ListDevicesRequest {
  int32 page_size = 1 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 100,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  string page_token = 2 [(buf.validate.field).string.(cadestro.v1.ulid_optional) = true];
  // UNSPECIFIED (0) means "no status filter"; ONLINE / OFFLINE narrow
  // the listing to that single status.
  DeviceStatus status_filter = 3 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  map<string, string> label_filter = 4 [
    (buf.validate.field).map.keys.string.max_len = 64,
    (buf.validate.field).map.values.string.max_len = 1024
  ];
  bool my_devices_only = 5; // when true, only return devices assigned to the authenticated user
}

message ListDevicesResponse {
  repeated Device devices = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetDeviceRequest {
