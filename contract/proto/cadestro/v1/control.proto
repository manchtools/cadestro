syntax = "proto3";

package cadestro.v1;

import "buf/validate/validate.proto";
import "cadestro/v1/actions.proto";
import "cadestro/v1/agent.proto";
import "cadestro/v1/common.proto";
import "cadestro/v1/validate_ext.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/manchtools/cadestro/contract/gen/go/cadestro/v1;cadestrov1";

// ============================================================================
// Agent Registration (called by agent during first-time setup)
// ============================================================================

message RegisterRequest {
  string token = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 255
  ];
  string hostname = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 253
  ];
  string agent_version = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32
  ];
  // Certificate Signing Request (PEM-encoded PKCS#10)
  // Agent generates its own key pair and sends CSR for signing
  bytes csr = 4 [(buf.validate.field).required = true];
}

message RegisterResponse {
  DeviceId device_id = 1 [(buf.validate.field).required = true];
  // mTLS credentials issued by control server
  bytes ca_cert = 2 [(buf.validate.field).required = true]; // CA certificate (PEM)
  // Signed device certificate (PEM) - private key stays on agent
  bytes certificate = 3 [(buf.validate.field).required = true];
  // Control URL for the agent's streaming connection; the agent stores this and
  // dials it for the AgentService bidi stream. Control terminates agent mTLS
  // itself, so this is control's own agent-listener address, which is normally
  // a different host from the web/API URL the agent registered against.
  string control_url = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uri = true
  ];
}

// ============================================================================
// Certificate Renewal (called by agent to renew expiring certificates)
// ============================================================================

message RenewCertificateRequest {
  // Certificate Signing Request (PEM-encoded PKCS#10)
  bytes csr = 1 [(buf.validate.field).required = true];
}

message RenewCertificateResponse {
  // New signed certificate (PEM)
  bytes certificate = 1;
  // Certificate expiry
  google.protobuf.Timestamp not_after = 2;
}

// ============================================================================
// Authentication
// ============================================================================

message RefreshTokenRequest {
  string refresh_token = 1 [(buf.validate.field).required = true];
}

message RefreshTokenResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  string refresh_token = 3;
}

message LogoutRequest {
  string refresh_token = 1 [(buf.validate.field).required = true];
}

message LogoutResponse {}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  User user = 1;
}

// ============================================================================
// Users
// ============================================================================

message User {
  string id = 1;
  string email = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp last_login_at = 4;
  bool disabled = 5;
  repeated IdentityLink identity_links = 6;
  // OIDC profile scope properties
  string display_name = 7;
  string given_name = 8;
  string family_name = 9;
  string preferred_username = 10;
  string picture = 11;
  string locale = 12;
  // Linux identity
  string linux_username = 13;
  int32 linux_uid = 14;
  // SSH access settings
  repeated SshPublicKey ssh_public_keys = 15;
  bool ssh_access_enabled = 16;
  bool ssh_allow_pubkey = 17;
  bool ssh_allow_password = 18;
  bool user_provisioning_enabled = 19;
  repeated InheritedRole inherited_roles = 20;
  // The user's directly-assigned roles, one entry per grant, carrying each
  // grant's scope. This is the role surface: a role granted both globally and
  // scoped to a device group appears as two RoleGrant entries, and revocation
  // names the grant, not just the role.
  repeated RoleGrant role_grants = 21;
}

message InheritedRole {
  string role_id = 1;
  string role_name = 2;
  string group_id = 3;
  string group_name = 4;
}

message SshPublicKey {
  string id = 1;
  string public_key = 2;
  string comment = 3;
  google.protobuf.Timestamp added_at = 4;
}

message Role {
  string id = 1;
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  string description = 3;
  repeated string permissions = 4;
  google.protobuf.Timestamp created_at = 5;
  bool is_system = 6;
}

// A single role grant on a user or user group, with its optional scope
// scope_kind == UNSPECIFIED is an unscoped/global grant (scope_id
// and scope_name empty). For a scoped grant, scope_id is the device- or
// user-group id and scope_name is that group's resolved display name
// (empty if the group was deleted).
message RoleGrant {
  Role role = 1;
  RoleGrantScopeKind scope_kind = 2;
  string scope_id = 3;
  string scope_name = 4;
}

message PermissionInfo {
  string key = 1;
  string group = 2;
  string description = 3;
  // Classifies what kind of target this permission acts on, which
  // determines whether (and how) it can be scoped on a role grant.
  // UNSPECIFIED = not scopable (fail-closed default). DEVICE = takes
  // RoleGrantScopeKind=DEVICE_GROUP. USER = takes USER_GROUP.
  // Surfaced so the web role-builder can gate the scope picker.
  PermissionTargetKind target_kind = 4;
}

// Explicit local erasure for subjects created by optional OIDC JIT.
// The control server rejects subjects created through SCIM.
message EraseJITUserRequest {
  string id = 1 [(buf.validate.field).string.ulid = true];
}

message EraseJITUserResponse {}

