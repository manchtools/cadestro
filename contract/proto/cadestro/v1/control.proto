}

// Update device inventory collection interval.
message SetDeviceInventoryIntervalRequest {
  string id = 1 [(buf.validate.field).string.ulid = true];
  int32 inventory_interval_minutes = 2 [
    (buf.validate.field).int32.gte = 120,
    (buf.validate.field).int32.lte = 10080,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ]; // 0 = inherit (group min, else 1440), else 2h–7d
}

// ============================================================================
// Registration Tokens
// ============================================================================

message RegistrationToken {
  string id = 1;
  string value = 2; // Only returned on creation
  string name = 3;
  int32 max_uses = 4; // 0 = unlimited
  int32 current_uses = 5; // Derived COUNT(devices.registration_token_id); never stored on tokens
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp created_at = 7;
  string created_by = 8;
  bool disabled = 9;
}

message CreateTokenRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  int32 max_uses = 2 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ]; // 0 = unlimited (for reusable tokens)
  // Enrollment tokens always expire. Set a sufficiently long TTL for the
  // rollout; 0/unset is intentionally not a valid token.
  google.protobuf.Timestamp expires_at = 3 [(buf.validate.field).required = true];
}

message CreateTokenResponse {
  RegistrationToken token = 1;
  // SHA-256 fingerprint of the control CA certificate DER. Provisioning
  // presents this beside token.value; agents require it during enrollment.
  string ca_fingerprint_pin = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.len = 64,
    (buf.validate.field).string.pattern = "^[0-9a-fA-F]+$"
  ];
}

message ListTokensRequest {
  int32 page_size = 1 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 100,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  string page_token = 2 [(buf.validate.field).string.(cadestro.v1.ulid_optional) = true];
  bool include_disabled = 3;
}

message ListTokensResponse {
  repeated RegistrationToken tokens = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Granular token updates
message RenameTokenRequest {
  string id = 1 [(buf.validate.field).string.ulid = true];
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
