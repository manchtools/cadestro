message ActionExecution {
  string id = 1;
  string device_id = 2;
  string action_id = 3; // Reference to ManagedAction
  ActionType type = 4;
  ExecutionStatus status = 5;
  string error = 6;
  CommandOutput output = 7; // Final output (set on completion)
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp dispatched_at = 9;
  google.protobuf.Timestamp completed_at = 10;
  int64 duration_ms = 11;
  string created_by = 12;
  CommandOutput live_output = 13; // Streaming output received so far (useful when status is RUNNING)
  DesiredState desired_state = 14; // Whether the action was meant to install/enable (PRESENT) or remove/disable (ABSENT)
  bool changed = 15; // Whether the execution made changes to the system (false = state was already as desired)
  bool compliant = 16; // Detection script result: true if compliant
  CommandOutput detection_output = 17; // Detection script output
  string action_name = 18; // Resolved from the action row (empty for inline actions)
  // Set when status is SCHEDULED (or was, before dispatch fired). The
  // UTC timestamp at which the deferred dispatch is configured to
  // fire. Populated when a Dispatch* request supplies the run_at
  // field so the server can defer the dispatch until the
  // operator-chosen time.
  google.protobuf.Timestamp scheduled_for = 19;
}

message DispatchActionRequest {
  string device_id = 1 [(buf.validate.field).string.ulid = true];
  // Either use an action or inline action
  oneof action_source {
    string action_id = 2 [(buf.validate.field).string.(cadestro.v1.ulid_optional) = true]; // Reference to ManagedAction
    Action inline_action = 3;
  }
  // When set, defer the dispatch until this UTC timestamp instead of
  // running it immediately. The execution record is created up front
  // with status SCHEDULED so the operator can see the pending dispatch
  // in the execution-history UI before it fires; on run_at the
  // deferred dispatch hits the standard path and the execution
  // transitions through PENDING / RUNNING and then onward to a
  // terminal status (SUCCESS, FAILED, TIMEOUT, SKIPPED, or
  // CANCELLED) the same as any immediate dispatch. Cancelable via
  // CancelExecution until the dispatch fires. Must be in the future
  // at scheduling time.
  google.protobuf.Timestamp run_at = 4;
  // When true, the dispatched action still respects the device's
  // maintenance window if the device has one configured. The default
  // (false) bypasses the window so admins can override an active
  // freeze.
  bool respect_maintenance_window = 5;
}

message DispatchActionResponse {
  ActionExecution execution = 1;
}

