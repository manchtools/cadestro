  DesiredState desired_state = 5;
  int32 timeout_seconds = 6;
  google.protobuf.Timestamp created_at = 7;
  string created_by = 8;
  ActionSchedule schedule = 9;
  google.protobuf.Timestamp updated_at = 10;
