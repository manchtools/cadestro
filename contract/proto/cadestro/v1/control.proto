  rpc ListActiveTerminalSessions(ListActiveTerminalSessionsRequest) returns (ListActiveTerminalSessionsResponse);
  rpc TerminateTerminalSession(TerminateTerminalSessionRequest) returns (TerminateTerminalSessionResponse);
}

message StartTerminalRequest {
  DeviceId device_id = 1 [(buf.validate.field).required = true];

  uint32 cols = 2 [
    (buf.validate.field).uint32.gt = 0,
    (buf.validate.field).uint32.lte = 65535,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  uint32 rows = 3 [
    (buf.validate.field).uint32.gt = 0,
    (buf.validate.field).uint32.lte = 65535,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

message StartTerminalResponse {

  SessionId session_id = 1 [(buf.validate.field).required = true];

  string session_token = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  string terminal_url = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uri = true,
    (buf.validate.field).string.prefix = "wss://"
  ];

  google.protobuf.Timestamp expires_at = 4 [(buf.validate.field).required = true];

  string tty_user = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
}

message StopTerminalRequest {
  SessionId session_id = 1 [(buf.validate.field).required = true];
}

message StopTerminalResponse {}

message TerminalSessionInfo {
  SessionId session_id = 1;

  UserId user_id = 2;
  string user_email = 3;

  DeviceId device_id = 4;
  string device_hostname = 5;

  string tty_user = 6;
  google.protobuf.Timestamp started_at = 7;

  google.protobuf.Timestamp last_activity_at = 8;
}

message ListActiveTerminalSessionsRequest {
  int32 page_size = 1 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 200,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  string page_token = 2 [(buf.validate.field).string.(cadestro.v1.ulid_optional) = true];

  DeviceId device_id = 3;

  UserId user_id = 4;
}

message ListActiveTerminalSessionsResponse {
  repeated TerminalSessionInfo sessions = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message TerminateTerminalSessionRequest {
  SessionId session_id = 1 [(buf.validate.field).required = true];

  string reason = 2 [
    (buf.validate.field).string.max_len = 512,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

message TerminateTerminalSessionResponse {}

message EncryptionAuthoringParams {
  optional string preshared_key = 1 [
    debug_redact = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  int32 rotation_interval_days = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 365
  ];
  int32 min_words = 3 [
    (buf.validate.field).int32.gte = 3,
    (buf.validate.field).int32.lte = 10,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  EncryptionDeviceBoundKeyType device_bound_key_type = 4 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  int32 user_passphrase_min_length = 5 [
    (buf.validate.field).int32.gte = 16,
    (buf.validate.field).int32.lte = 128,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  LpsPasswordComplexity user_passphrase_complexity = 6 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

message ManagedEncryptionParams {
  bool preshared_key_configured = 1;
  int32 rotation_interval_days = 2;
  int32 min_words = 3;
  EncryptionDeviceBoundKeyType device_bound_key_type = 4;
  int32 user_passphrase_min_length = 5;
  LpsPasswordComplexity user_passphrase_complexity = 6;
}

message WifiAuthoringParams {
  string ssid = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255
  ];
  WifiAuthType auth_type = 2 [(buf.validate.field).required = true];
  optional string psk = 3 [
    debug_redact = true,
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_len = 64
  ];
  string ca_cert = 4;
  string client_cert = 5;
  optional string client_key = 6 [
    debug_redact = true,
    (buf.validate.field).string.max_len = 65536
  ];
  string identity = 7 [
    (buf.validate.field).string.max_len = 254,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  bool auto_connect = 8;
  bool hidden = 9;
  int32 priority = 10 [
    (buf.validate.field).int32.gte = -1,
    (buf.validate.field).int32.lte = 999,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

message ManagedWifiParams {
  string ssid = 1;
  WifiAuthType auth_type = 2;
  bool psk_configured = 3;
  string ca_cert = 4;
  string client_cert = 5;
  bool client_key_configured = 6;
  string identity = 7;
  bool auto_connect = 8;
  bool hidden = 9;
  int32 priority = 10;
}
