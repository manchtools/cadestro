syntax = "proto3";

package cadestro.v1;

import "buf/validate/validate.proto";
import "cadestro/v1/actions.proto";
import "cadestro/v1/common.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/manchtools/cadestro/contract/gen/go/cadestro/v1;cadestrov1";

service AgentService {
  rpc Stream(stream AgentMessage) returns (stream ServerMessage);
}

message AgentMessage {
  MessageId id = 1 [(buf.validate.field).required = true];

  oneof payload {
    Hello hello = 10;
    Heartbeat heartbeat = 11;
    SyncRequest sync_request = 12;
    ActionResult action_result = 20;
    ManifestResult manifest_result = 21;
  }
}

message ServerMessage {
  MessageId id = 1 [(buf.validate.field).required = true];

  oneof payload {
    Welcome welcome = 10;
    SyncState sync_state = 11;
    ResultAck result_ack = 12;
    Error error = 13;
  }
}

message Hello {
  DeviceId device_id = 1 [(buf.validate.field).required = true];
  string agent_version = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32
  ];
  string hostname = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 253
  ];
  string arch = 4 [
    (buf.validate.field).string.max_len = 16,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

message Heartbeat {}

message Welcome {
  string server_version = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32
  ];
  google.protobuf.Duration heartbeat_interval = 2;
}

message SyncRequest {}

message SyncState {
  int32 sync_interval_minutes = 1 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 1440
  ];
  DesiredPolicy desired_policy = 2 [(buf.validate.field).required = true];
}

message DesiredPolicy {
  PolicyRevisionId revision = 1 [(buf.validate.field).required = true];
  repeated Manifest manifests = 2;
}

message Manifest {
  ManifestId manifest_id = 1 [(buf.validate.field).required = true];
  OccurrenceId occurrence_id = 2 [(buf.validate.field).required = true];
  Action action = 3 [(buf.validate.field).required = true];
  ActionSchedule schedule = 4 [(buf.validate.field).required = true];
}

message ManifestResult {
  RunId run_id = 1 [(buf.validate.field).required = true];
  ManifestId manifest_id = 2 [(buf.validate.field).required = true];
  ExecutionStatus status = 3 [(buf.validate.field).required = true];
  google.protobuf.Timestamp completed_at = 4;
  google.protobuf.Duration duration = 5 [(buf.validate.field).duration.gte = {}];
  string error = 6 [
    (buf.validate.field).string.max_len = 4096,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

enum ResultAckCode {
  RESULT_ACK_CODE_UNSPECIFIED = 0;
  RESULT_ACK_CODE_ACCEPTED = 1;
  RESULT_ACK_CODE_REJECTED = 2;
}

message ResultAck {
  ResultAckCode code = 1 [(buf.validate.field).required = true];
}

message Error {
  string message = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 1024
  ];
}
