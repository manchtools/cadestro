syntax = "proto3";

package cadestro.v1;

import "buf/validate/validate.proto";
import "cadestro/v1/common.proto";

option go_package = "github.com/manchtools/cadestro/contract/gen/go/cadestro/v1;cadestrov1";

service DeviceAuthService {

  rpc Enroll(EnrollRequest) returns (EnrollResponse);

  rpc GetEnrollmentStatus(GetEnrollmentStatusRequest) returns (GetEnrollmentStatusResponse);
}

message EnrollRequest {
  string server_url = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uri = true
  ];
  string token = 2 [(buf.validate.field).required = true];

  string ca_fingerprint_pin = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.len = 64,
    (buf.validate.field).string.pattern = "^[0-9a-fA-F]+$"
  ];
}

message EnrollResponse {

  bool success = 1 [(buf.validate.field).required = true];
  DeviceId device_id = 2;
  string error = 3 [
    (buf.validate.field).string.max_len = 4096,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

message GetEnrollmentStatusRequest {}

message GetEnrollmentStatusResponse {
  bool enrolled = 1 [(buf.validate.field).required = true];
  DeviceId device_id = 2;
}
