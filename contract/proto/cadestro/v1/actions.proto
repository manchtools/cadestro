syntax = "proto3";

package cadestro.v1;

import "buf/validate/validate.proto";
import "cadestro/v1/common.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/manchtools/cadestro/contract/gen/go/cadestro/v1;cadestrov1";

enum ActionType {
  ACTION_TYPE_UNSPECIFIED = 0;
  ACTION_TYPE_PACKAGE = 1;
  ACTION_TYPE_UPDATE = 2;
  ACTION_TYPE_SHELL = 3;
}

message Action {
  ActionId id = 1 [(buf.validate.field).required = true];
  ActionType type = 2 [(buf.validate.field).required = true];
  DesiredState desired_state = 3 [(buf.validate.field).required = true];
  int32 timeout_seconds = 4 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 3600,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  ActionSchedule schedule = 5;

  oneof params {
    PackageParams package = 6;
    UpdateParams update = 7;
    ShellParams shell = 8;
  }
}

message ActionSchedule {
  int32 interval_hours = 1 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 8760,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  bool run_on_assign = 2;
  bool skip_if_unchanged = 3;
}

message PackageParams {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255
  ];
  string version = 2 [
    (buf.validate.field).string.max_len = 128,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

message UpdateParams {}

message ShellParams {
  string script = 1 [
    (buf.validate.field).string.max_len = 1048576,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  string interpreter = 2 [
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  string working_directory = 3 [
    (buf.validate.field).string.prefix = "/",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  map<string, string> environment = 4 [
    (buf.validate.field).map.keys.string.max_len = 255,
    (buf.validate.field).map.values.string.max_len = 4096
  ];
  string detection_script = 5 [
    (buf.validate.field).string.max_len = 1048576,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  bool is_compliance = 6;
}

message ActionResult {
  ActionId action_id = 1 [(buf.validate.field).required = true];
  ExecutionStatus status = 2 [(buf.validate.field).required = true];
  string error = 3 [
    (buf.validate.field).string.max_len = 4096,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  CommandOutput output = 4;
  google.protobuf.Timestamp completed_at = 5;
  google.protobuf.Duration duration = 6 [(buf.validate.field).duration.gte = {}];
  bool changed = 7;
  bool compliant = 8;
  CommandOutput detection_output = 9;
  RunId run_id = 10 [(buf.validate.field).required = true];
  OccurrenceId occurrence_id = 11 [(buf.validate.field).required = true];
}
